<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64"
  height="64">
  <defs>
    <linearGradient id="gnosia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="14" fill="#0b0f19" stroke="#1e293b"
    stroke-width="1.5" />

  <!-- Outer HUD Ring & Cross-hair points -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#1e293b" stroke-width="1"
    stroke-dasharray="2 4" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#cyan-glow)"
    stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Outer Compass Diamond points -->
  <path d="M 32 6 L 35 12 L 29 12 Z" fill="#f43f5e" />
  <path d="M 32 58 L 35 52 L 29 52 Z" fill="#38bdf8" />
  <path d="M 6 32 L 12 29 L 12 35 Z" fill="#f43f5e" />
  <path d="M 58 32 L 52 29 L 52 35 Z" fill="#38bdf8" />

  <!-- Orbit Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="#f43f5e"
    stroke-width="1" stroke-opacity="0.6" transform="rotate(-25 32 32)" />

  <!-- Sci-Fi Eye Silhouette Outer -->
  <path d="M 12 32 C 18 20, 46 20, 52 32 C 46 44, 18 44, 12 32 Z"
    fill="none"
    stroke="url(#gnosia-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)" />

  <!-- Inner Eye Arc -->
  <path d="M 19 32 C 24 24, 40 24, 45 32 C 40 40, 24 40, 19 32 Z"
    fill="#0f172a"
    fill-opacity="0.8"
    stroke="#38bdf8"
    stroke-width="1" />

  <!-- Gnosia Core / Iris -->
  <circle cx="32" cy="32" r="7.5" fill="#0b0f19" stroke="#f43f5e"
    stroke-width="2" />
  <circle cx="32" cy="32" r="4" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="30" cy="30" r="1.5" fill="#ffffff" />

  <!-- Scanline / Cross Tick -->
  <line x1="32" y1="20" x2="32" y2="24" stroke="#38bdf8" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="32" y1="40" x2="32" y2="44" stroke="#38bdf8" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="20" y1="32" x2="24" y2="32" stroke="#f43f5e" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="40" y1="32" x2="44" y2="32" stroke="#f43f5e" stroke-width="1.5"
    stroke-linecap="round" />
</svg>
